[project]
name = "hikvision_bridge"
version = "0.1.0"
description = "Home Assistant integration for Hikvision cameras, recorders and Hik-Connect"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]

[tool.coverage.run]
source = ["custom_components.hikvision_bridge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "BLE", "RUF", "PL", "PT", "N"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101",      # asserts are fine in tests
    "RUF012",
    "N818",      # fault classes describe conditions, not errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "SLF001", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hikvision_bridge", "tests"]
combine-as-imports = true
