<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How Hikvision Bridge connects Home Assistant to a recorder and its cameras</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3f7a"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14a898"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="16" fill="#f6f8fc"/>

  <!-- Home Assistant -->
  <rect x="30" y="130" width="210" height="150" rx="14" fill="#10306b"/>
  <text x="135" y="168" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">Home Assistant</text>
  <text x="135" y="194" fill="#9fe9df" font-size="14" text-anchor="middle">Hikvision Bridge</text>
  <text x="135" y="226" fill="#d7def0" font-size="12.5" text-anchor="middle">sensors · switches · image</text>
  <text x="135" y="244" fill="#d7def0" font-size="12.5" text-anchor="middle">settings · cameras · events</text>

  <!-- Recorder -->
  <rect x="380" y="150" width="190" height="110" rx="14" fill="#ffffff" stroke="#1f3f7a" stroke-width="2"/>
  <text x="475" y="190" fill="#10306b" font-size="17" font-weight="600" text-anchor="middle">NVR / DVR</text>
  <text x="475" y="214" fill="#44516b" font-size="12.5" text-anchor="middle">events · storage · I/O</text>
  <text x="475" y="232" fill="#44516b" font-size="12.5" text-anchor="middle">channels 1 … n</text>

  <!-- Cameras -->
  <g font-size="13" text-anchor="middle">
    <rect x="690" y="70" width="160" height="56" rx="12" fill="#ffffff" stroke="#1f3f7a" stroke-width="2"/>
    <text x="770" y="103" fill="#10306b">Camera 1</text>
    <rect x="690" y="177" width="160" height="56" rx="12" fill="#ffffff" stroke="#1f3f7a" stroke-width="2"/>
    <text x="770" y="210" fill="#10306b">Camera 2</text>
    <rect x="690" y="284" width="160" height="56" rx="12" fill="#ffffff" stroke="#1f3f7a" stroke-width="2"/>
    <text x="770" y="317" fill="#10306b">Camera …</text>
  </g>

  <!-- HA <-> NVR -->
  <line x1="240" y1="205" x2="376" y2="205" stroke="#1f3f7a" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="308" y="194" fill="#1f3f7a" font-size="12" text-anchor="middle">ISAPI</text>
  <text x="308" y="226" fill="#44516b" font-size="11" text-anchor="middle">push events</text>

  <!-- NVR <-> cameras (PoE) -->
  <g stroke="#7d8aa6" stroke-width="2">
    <line x1="570" y1="185" x2="688" y2="100"/>
    <line x1="570" y1="205" x2="688" y2="205"/>
    <line x1="570" y1="225" x2="688" y2="310"/>
  </g>
  <text x="625" y="196" fill="#7d8aa6" font-size="11" text-anchor="middle">PoE</text>

  <!-- Direct camera connection -->
  <path d="M 200 130 C 270 80, 560 70, 688 95" fill="none" stroke="#14a898" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-teal)"/>
  <text x="440" y="34" fill="#0f8a7d" font-size="13" font-weight="600" text-anchor="middle">optional: direct camera connection</text>
  <text x="440" y="52" fill="#44516b" font-size="11.5" text-anchor="middle">live stream, image settings, detections</text>

  <!-- Hik-Connect -->
  <path d="M 70 365 a 22 22 0 0 1 30 -26 a 30 30 0 0 1 56 6 a 20 20 0 0 1 4 40 h -86 a 18 18 0 0 1 -4 -20 z" fill="#ffffff" stroke="#7d8aa6" stroke-width="1.8"/>
  <text x="114" y="372" fill="#44516b" font-size="11.5" text-anchor="middle">Hik-Connect</text>
  <line x1="135" y1="280" x2="125" y2="333" stroke="#7d8aa6" stroke-width="1.8" stroke-dasharray="4 5"/>
  <text x="142" y="312" fill="#7d8aa6" font-size="11" text-anchor="start">optional cloud status</text>
</svg>
